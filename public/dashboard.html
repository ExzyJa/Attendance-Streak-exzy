<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Attendance Streak moderator dashboard created by Exzy-Ja.">
  <title>Moderator Dashboard | Attendance Streak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Attendance Streak home">
      <img class="brand-logo" src="/assets/exzy-logo.png" alt="Exzy logo">
      <span>Attendance<br><strong>Streak</strong></span>
    </a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/dashboard.html" aria-current="page">Dashboard</a>
    </nav>
    <a class="header-invite" href="/auth/logout">Log out <span>↗</span></a>
    <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch color theme">◐</button>
  </header>

  <main>
    <section class="dashboard-section dashboard-page" id="dashboard">
      <div class="dashboard-inner section-grid">
        <div class="dashboard-intro reveal"><p class="eyebrow">Moderator control</p><h1>Set it up<br><em>without commands.</em></h1><p>Configure attendance for a server where you have Manage Server permission.</p><a class="button button-primary dashboard-login" href="/auth/login">Sign in with Discord <span>↗</span></a></div>
        <div class="web-dashboard reveal reveal-delay" id="web-dashboard">
          <div class="dashboard-welcome"><div><span class="dashboard-kicker">ATTENDANCE CONTROL ROOM</span><h3 id="dashboard-status">Sign in to begin</h3></div><a class="dashboard-logout" href="/auth/logout">Log out</a></div>
          <div class="dashboard-message" id="dashboard-message" role="status"></div>
          <div id="setup-form-wrap" hidden>
            <form id="web-setup-form">
              <label>Server<select id="setup-guild" required><option value="">Choose a server</option></select></label>
              <div class="form-grid"><label>Attendance channel<select id="setup-channel" required><option value="">Choose a channel</option></select></label><label>Announcement channel<select id="setup-announcement"><option value="">No announcement channel</option></select></label></div>
              <div class="form-grid"><label>Daily time<input id="setup-time" type="time" value="00:00" required></label><label>Timezone<input id="setup-timezone" value="Asia/Manila" required></label></div>
              <label>Post title<input id="setup-title" value="Daily Attendance" maxlength="256"></label>
              <label>Post message<textarea id="setup-body" rows="2">React with ✅ if you are online today.</textarea></label>
              <label class="toggle-label"><input id="setup-automation" type="checkbox"><span class="toggle-ui"></span><span>Enable active / inactive role automation</span></label>
              <div class="form-grid role-fields" id="role-fields" hidden><label>Active role<select id="setup-active-role"><option value="">Choose active role</option></select></label><label>Inactive role<select id="setup-inactive-role"><option value="">Choose inactive role</option></select></label></div>
              <label>Exemption roles <span class="field-hint">Ctrl/Cmd-click for multiple</span><select id="setup-exemptions" multiple size="4"></select></label>
              <button class="button button-primary save-button" type="submit">Save configuration <span>✓</span></button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><span>Attendance Streak</span><span>Created by <strong>Exzy-Ja</strong></span><a href="/">Back home ↑</a></footer>
  <script src="/app.js"></script>
</body>
</html>
